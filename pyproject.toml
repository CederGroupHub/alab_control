[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alab_control"
version = "0.1.0"
description = "Drivers for ALab devices."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Alab Project Team" },
]
dependencies = [
    "Flask>=2.2.5",
    "control>=0.9.4",
    "cryptography>=38.0.1",
    "dill>=0.3.8",
    "jinja2~=3.1.2",
    "matplotlib>=3.5.2",
    "molmass>=2021.6.18",
    "numpy>=1.23.0",
    "opencv-python>=4.7.0.68",
    "ortools>=9.3.10497",
    "pandas>=1.4.3",
    "paramiko>=3.4.1,<6",
    "phidget22>=1.22.20250106",
    "pyModbusTCP==0.1.10",
    "pydantic>=1.10.2",
    "pymatgen>=2023.8.10",
    "pymodbus==2.5.3",
    "pymongo>=3.12.3",
    "pyserial>=3.5",
    "requests>=2.18.4",
    "retry>=0.9.2",
    "scipy>=1.9.2",
    "sympy>=1.11.1",
    "tomli>=2.0.1; python_version < '3.11'",
    "tqdm>=4.64.1",
    "urx>=0.11.0",
    "websocket-client>=1.5.0",
    "xmltodict~=0.13.0",
    "zeep>=4.2.1",
]

[project.optional-dependencies]
ceder = [
    "python-urx @ git+https://github.com/Alab-Hub/python-urx",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
alab_control = [
    "**/*.csv",
    "**/*.wsdl",
    "**/*.chm",
    "**/*.ttf",
    "**/*.png",
    "**/*.pkl",
    "**/*.script",
    "**/urp_template",
]
